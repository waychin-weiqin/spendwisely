services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: production
      PORT: 5000
      SESSION_SECRET: ${SESSION_SECRET}
      DATABASE_URL: postgres://expense:${POSTGRES_PASSWORD}@db:5432/expense_tracker
    depends_on:
      db:
        condition: service_healthy

  migrate:
    build:
      context: .
      target: build
    environment:
      DATABASE_URL: postgres://expense:${POSTGRES_PASSWORD}@db:5432/expense_tracker
    depends_on:
      db:
        condition: service_healthy
    command: npm run db:push
    profiles: ["migrate"]

  caddy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  caddy_data:
  caddy_config:
